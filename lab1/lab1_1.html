<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пенсионный калькулятор</title>
    <style>
        .form-group {
        margin-bottom: 15px;
        }

        label {
        margin-bottom: 5px;
        }

        .radio-group label {
        margin-right: 15px;
        }

        textarea {
        width: 100%;
        max-width: 400px;
        margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Пенсионный калькулятор</h1>

    <form id="pensionForm">
        <div class="form-group">
            <label for="age">Возраст:</label>
            <input type="number" id="age" required min="0">
        </div>

        <div class="form-group radio-group">
            <label>Пол:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Мужской</label>
            
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Женский</label>
        </div>

        <button type="submit">Рассчитать</button>
    </form>

    <textarea id="result" readonly placeholder="Результат расчета появится здесь..."></textarea>

    <script src="js/lab1_1.js"></script>

</body>
</html>
