<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Select</title>
</head>
<body>
    <select id="musicSelect">
        <option value="Rock">Рок</option>
        <option value="Blues" selected>Блюз</option>
    </select>

    <script>
        'use strict';

        const select = document.getElementById('musicSelect');
        
        console.log('Значение:', select.value, '| Текст:', select.options[select.selectedIndex].text);

        const newOption = new Option('Классика', 'Classic', false, true);
        select.add(newOption);
        
        console.log('Новая выбранная опция:', select.value);
    </script>
</body>
</html>
